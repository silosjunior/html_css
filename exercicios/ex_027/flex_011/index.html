<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }

        div#box_a {
            flex-shrink: 0;
            flex-grow: 1;
        }
        div#box_b {
            flex-shrink: 8;
            flex-grow: 1;
        }
        div#box_c {
            flex-shrink: 1;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="box_a">A</div>
        <div class="item" id="box_b">B</div>
        <div class="item" id="box_c">C</div>
    </div>
</body>
</html>
