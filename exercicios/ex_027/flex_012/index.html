<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        div#box_a {
            /* flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px; */

            flex: 1 0 200px; 
            
            /* grow -> shrink -> flex-basis (flex: 0 1 auto = flex: initial) */
            /* flex: 0 0 auto; = flex: none; [inflexível] */
            /* flex: 1 1 auto; = flex: auto; [máxima flexibilidade]
            /* flex: 3; = flex: 3 1 auto; [flex definido apens para "grow" os outros ficam padrão]*/

        }
        div#box_b {
            /* flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 150px; */

            flex: 1 1 150px;
        }
        div#box_c {
            /* flex-shrink: 8;
            flex-grow: 1;
            flex-basis: auto; */

            flex: 1 8 auto;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="box_a">A</div>
        <div class="item" id="box_b">B</div>
        <div class="item" id="box_c">C</div>
    </div>
</body>
</html>
