<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocapitalize="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="i_nome">Nome</label>
                <input type="text" name="nome" id="i_nome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="i_email">E-mail:</label>
                <input type="email" name="email" id="i_email" required autocomplete="email">
            </p>
            <p>
                <label for="i_phone">Telefone</label>
                <input type="tel" name="phone" id="i_phone" autocomplete="tel" required pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="(xx)xxxxx-xxxx">
            </p>
        </fieldset>
        <!-- Expressões Regulares RegEx -->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
