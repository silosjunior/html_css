<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1> <hr>
    <form action="cadastro.php" method="post" autocomplete="on">
    <p>
        <label for="i_state">Estado:</label>
        <select name="state" id="i_state">

            <optgroup label="Sudeste">
                <option value="" selected>--- Escolha ---</option>
                <option value="MG">Minas Gerais</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="SP">São Paulo</option>
            </optgroup>

            <optgroup label="Nordeste">
                <option value="BA">Bahia</option>
                <option value="MA">Maranhão</option>
                <option value="PE">Pernambuco</option>
                <option value="RN">Rio Grande do Norte</option>
            </optgroup>
        </select>
    </p>
        <label for="i_prof">Profissão:</label>
        <input type="text" name="prof" id="i_prof" list="lst_prof">
        <datalist id="lst_prof">
            <option value="ADM">Administrador</option>
            <option value="CONT">Contabilista</option>
            <option value="DEV">Desenvolvedor</option>
            <option value="PROF">Professor</option>
        </datalist>

        <p>
            <label for="i_msg">Mensagem:</label> <br>
            <textarea name="msg" id="i_msg" cols="30" rows="10" placeholder="Sua mensagem aqui..."></textarea>
        </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
