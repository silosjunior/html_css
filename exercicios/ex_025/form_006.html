<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1> <hr>
    <form action="cadastro.php" method="post" autocomplete="on"></form>
    <p>
        <label for="i_cor">Cor:</label>
        <input type="color" name="cor" id="i_cor" value="darkblue">
    </p>

    <p>
        <label for="i_level">Nível de Satisfação:</label>
        <input type="range" name="level" id="i_level" min="1" max="5" value="4">
    </p>

    <p>
        <label for="i_photo">Foto de Perfil:</label>
        <input type="file" name="photo" id="i_photo"><!-- Use o método POST para envio de arquivos -->
    </p>

    <p>
        <input type="submit" name="" id="" value="Enviar">
        <input type="reset" name="" id="" value="Limpar">
    </p>
</body>
</html>
