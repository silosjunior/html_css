<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="i_nome">Nome:</label>
            <input type="text" name="Nome" id="i_nome" required minlength="5" maxlength="30" placeholder="Nome completo" autocomplete="name">
        </p>
        <p>
            <label for="i_media">Média:</label>
            <input type="number" name="media" id="i_media" min="0" max="10" placeholder="0-10" step="0.1" required value="5">
        </p>
        <p>
            <label for="i_mes">Período Letivo</label>
            <input type="month" name="mes" id="i_mes" value="2026-11">
        </p>
        <p>
            <label for="i_day">Dia da Prova:</label>
            <input type="date" name="day" id="i_day" value="2026-11-07">
        </p>
        <p>
            <label for="i_hora">Hora da Prova:</label>
            <input type="time" name="hour" id="i_hour" value="11:11">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
