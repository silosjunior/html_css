<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="i_sx_mas" checked value="M"> <label for="i_sx_mas">Masculino</label> <br>
            <input type="radio" name="sexo" id="i_sx_fem" value="F"><label for="i_sx_fem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="sp_foot" id="i_sp_foot"> <label for="i_sp_foot">Futebol</label> <br>
            <input type="checkbox" name="sp_bas" id="i_sp_bas"><label for="i_sp_bas">Basquete</label> <br>
            <input type="checkbox" name="sp_nat" id="i_sp_nat"><label for="i_sp_nat">Natação</label> <br>
            <input type="checkbox" name="sp_ten" id="i_sp_ten"><label for="i_sp_ten">Tênis</label> <br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
