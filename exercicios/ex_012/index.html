<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor:</p>
    <video width="560" poster="imagens/capa.png" controls autoplay loop>
        <source src="midia/meu_video_mp4.mp4" type="video/mp4">
        <source src="midia/meu_video_webm.webm" type="video/webm">
        <source src="midia/meu_video_ogv.ogv" type="video/ogb">
        <p>Seu navegador não possui compatibilidade para reprodução de vídeos.</p>
    </video>
    <h1>Inserindo vídeos do YouTube</h1>
<iframe 
  width="560" 
  height="315" 
  src="https://www.youtube.com/embed/fJsqFb702Pg?si=PGeiFeY5kzA8Yy-3" 
  title="YouTube video player" 
  frameborder="0" 
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
  referrerpolicy="strict-origin-when-cross-origin" 
  allowfullscreen>
</iframe>

</body>
</html>
